spring.application.name=Geo-chat-App

# Render automatically injects PORT (defaults to 8085 locally)
server.port=${PORT:8085}

# Database
spring.mongodb.uri=${SPRING_MONGODB_URI}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000


# Resend HTTP Email API (works over HTTPS on Render free tier)
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

